spring.application.name=Capstone-project

# PostgreSQL database "capstone_db". Tables are created and seeded by Flyway
# (src/main/resources/db/migration), not by Hibernate.
spring.datasource.url=jdbc:postgresql://localhost:5432/capstone_db?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=304599
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool with bounded waits (no infinite blocking)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# Flyway applies db/migration/V*.sql in order at startup and records them in flyway_schema_history.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Bind to loopback only and serve the API under /api/v1 (matches the servers entry in openapi.yaml)
server.address=127.0.0.1
server.servlet.context-path=/api/v1

# Omit null fields (e.g. followed flag for anonymous callers, delivery date for eBooks)
spring.jackson.default-property-inclusion=non_null

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Bearer tokens (JWT) are validated against the identity provider's public keys.
# The key set is fetched lazily on the first authenticated request.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:https://localhost:9443/oauth2/jwks}
